<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rukmini & Krishna</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- =========================================
         ENVELOPE OPENING
    ========================================== -->

    <section
        class="opening"
        id="opening"
    >


        <div
            class="envelope-area"
            onclick="openInvite()"
        >


            <!-- ENVELOPE -->

            <div
                class="envelope"
                id="envelope"
            >


                <!-- LETTER INSIDE ENVELOPE -->

                <div class="invitation-card">

                    <div class="card-border">


                        <!-- WATERCOLOR IMAGE -->

                        <div class="letter-image">

                            <img
                                src="couple-feet.png"
                                alt="Wedding illustration"
                            >

                        </div>


                        <!-- TEXT ON LETTER -->

                        <div class="letter-content">

                            <p class="letter-small">
                                YOU'RE INVITED TO CELEBRATE
                            </p>


                            <h2>
                                Rukmini

                                <span>
                                    &amp;
                                </span>

                                Krishna
                            </h2>


                            <p class="letter-date">
                                18 • 12 • 2026
                            </p>

                        </div>


                    </div>

                </div>



                <!-- ENVELOPE BACK -->

                <div class="envelope-back"></div>



                <!-- LEFT FOLD -->

                <div class="envelope-left"></div>



                <!-- RIGHT FOLD -->

                <div class="envelope-right"></div>



                <!-- BOTTOM FOLD -->

                <div class="envelope-bottom"></div>



                <!-- TOP FLAP -->

                <div class="envelope-flap"></div>



                <!-- WAX SEAL -->

                <div class="wax-seal">

                    <span>
                        RK
                    </span>

                </div>


            </div>



            <!-- CLICK TO OPEN -->

            <p class="open-text">
                CLICK TO OPEN
            </p>


        </div>


    </section>



    <!-- =========================================
         MAIN WEDDING INVITATION
    ========================================== -->

    <main
        id="mainInvite"
        class="main-invite"
    >


        <!-- =====================================
             HERO.HTML

             Hero
             Scratch Date
             Countdown
        ====================================== -->

        <div id="heroContainer"></div>



        <!-- =====================================
             JOURNEY.HTML

             Wedding Events
             Kolam Side Borders
        ====================================== -->

        <div id="journeyContainer"></div>



        <!-- =====================================
             LOCATION.HTML

             Venue
             Map
        ====================================== -->

        <div id="locationContainer"></div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
